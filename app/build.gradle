plugins {
    id 'java'
}

group = 'com.tree3'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = uri('https://jitpack.io')
    }
    // youtube-source plugin, replaces LavaPlayer's built-in YouTube extractor
    maven {
        url = uri('https://maven.lavalink.dev/releases')
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'net.dv8tion:JDA:6.5.0'
    // Source: https://mvnrepository.com/artifact/io.github.cdimascio/dotenv-java
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    annotationProcessor project(':processor')
    compileOnly project(':processor')
    // Source: https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation 'org.slf4j:slf4j-api:2.0.18'
    // Source: https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    implementation 'ch.qos.logback:logback-classic:1.5.32'
    implementation 'org.scilab.forge:jlatexmath:1.0.7'
    implementation 'club.minnced:jdave-api:0.1.8'

    // Compiled natives for libdave for the specified platform
    implementation 'club.minnced:jdave-native-linux-x86-64:0.1.8'
    implementation 'club.minnced:jdave-native-linux-aarch64:0.1.8'
    implementation 'club.minnced:jdave-native-win-x86-64:0.1.8'
    implementation 'club.minnced:jdave-native-darwin:0.1.8'

    implementation 'club.minnced:opus-java:1.1.1'
    implementation 'dev.arbjerg:lavaplayer:2.2.7'
    // LavaPlayer's bundled YouTube source can no longer parse YouTube's player script;
    // this maintained plugin replaces it. Expect to bump this when YouTube changes things.
    implementation 'dev.lavalink.youtube:v2:1.18.1'
    // Source: https://mvnrepository.com/artifact/com.googlecode.soundlibs/soundlibs
    implementation 'com.googlecode.soundlibs:soundlibs:1.4'
}

tasks.register('runBot', JavaExec) {
    dependsOn 'assemble'
    group = 'application'
    description = 'Runs the Bot'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tree3.Main'
}

tasks.test {
    useJUnitPlatform()
}
